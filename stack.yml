# Part 2 - Docker Swarm stack
# Same application, deployed as a stack instead of with `docker compose`.
# Differences from docker-compose.yml:
#   - no `build:` key (Swarm deploys images, it does not build them)
#   - no `container_name:` (Swarm names tasks itself)
#   - `deploy:` keys for replicas, resource limits and restart policy
#   - the network uses the `overlay` driver
#   123
# Deploy with:  docker stack deploy -c stack.yml ccstack

services:
  web:
    image: YOUR_DOCKERHUB_USERNAME/cc-homework-app:v1
    ports:
      - "8080:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_VERSION: "v1"
      PAGE_TITLE: "Cloud Computing Homework - v1"
    networks:
      - appnet
    deploy:
      replicas: 1                # scaled to 3 in Part 2, step 4
      restart_policy:
        condition: on-failure    # this is what replaces a killed task
      update_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - appnet
    deploy:
      replicas: 1                # a single Redis instance owns the volume
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  redis_data:

networks:
  appnet:
    driver: overlay              # overlay, not bridge, for Swarm
