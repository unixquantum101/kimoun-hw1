# Part 1 - Docker Compose
# Two services: a Flask web app and a Redis backing store.
# Redis data lives on a NAMED VOLUME so it survives `docker compose down`.
# Both services sit on a CUSTOM NETWORK and reach each other by service name.

services:
  web:
    build: ./app
    image: unixquantum/myhwpython:v1.0.0
    container_name: cc_web
    ports:
      - "8080:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_VERSION: "v1.0.0"
      PAGE_TITLE: "Cloud Computing Homework - v1.0.0"
    depends_on:
      - redis
    networks:
      - appnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - appnet
    restart: unless-stopped

volumes:
  redis_data:

networks:
  appnet:
    driver: bridge
