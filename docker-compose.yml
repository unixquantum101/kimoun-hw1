# Part 1 - Docker Compose
# Two services: a Flask web app and a Redis backing store.
# Redis data lives on a NAMED VOLUME so it survives `docker compose down`.
# Both services sit on a CUSTOM NETWORK and reach each other by service name.

services:
  web:
    build: ./app
    # Tagged with the Docker Hub name now, so Parts 2-4 reuse the same image.
    image: unixquantum/myhwpython:v1
    container_name: cc_web
    ports:
      - "8080:5000"
    environment:
      REDIS_HOST: redis          # resolved by Docker's DNS on appnet
      REDIS_PORT: "6379"
      APP_VERSION: "v1"
      PAGE_TITLE: "Cloud Computing Homework - v1"
    depends_on:
      - redis
    networks:
      - appnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    # appendonly yes -> Redis writes every change to disk, so the counter
    # really does survive a restart (this is what the named volume stores).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - appnet
    restart: unless-stopped

volumes:
  redis_data:                    # named volume (Part 1, step 2)

networks:
  appnet:                        # custom network (Part 1, step 3)
    driver: bridge
